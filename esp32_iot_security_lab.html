} mgmt_hdr_t;

void IRAM_ATTR sniffCB(void* buf, wifi_promiscuous_pkt_type_t type) {
  if (type != WIFI_PKT_MGMT) return;
  wifi_promiscuous_pkt_t* p = (wifi_promiscuous_pkt_t*)buf;
  mgmt_hdr_t* h = (mgmt_hdr_t*)p->payload;
  // Probe Request frame control = 0x0040
  if ((h->frame_ctrl & 0x00FC) != 0x0040) return;

  uint8_t* body = p->payload + sizeof(mgmt_hdr_t);
  uint8_t ssid_len = body[1];
  char ssid[33] = "<any>";
  if (body[0]==0 && ssid_len>0 && ssid_len<33) {

    h->src[0],h->src[1],h->src[2],h->src[3],h->src[4],h->src[5]);

  std::string m(mac), s(ssid);
  if (!seen[m].count(s)) {
    seen[m].insert(s);
    Serial.printf("[PROBE] %s  ->  \\"%s\\"  (RSSI:%d)\\n", mac, ssid, p->rx_ctrl.rssi);

  0x00,0x00,0x00,0x00,0x00,0x00,             // SA (filled per beacon)

  0x31,0x04,                                  // Capability Info
  0x00                                        // SSID element tag
};

uint8_t buf[200];

void sendBeacon(const char* ssid) {
  uint8_t mac[6] = {0x02,(uint8_t)random(256),(uint8_t)random(256),
                         (uint8_t)random(256),(uint8_t)random(256),(uint8_t)random(256)};

const C7=`#include <BLEDevice.h>

  void onResult(BLEAdvertisedDevice dev) {
    Serial.printf("\\n[BLE] %-30s  MAC: %s  RSSI: %d\\n",
      dev.getName().length() ? dev.getName().c_str() : "(hidden)",

      std::string md = dev.getManufacturerData();
      Serial.printf("       MfrData : ");

        uint16_t vid = (uint8_t)md[0] | ((uint8_t)md[1]<<8);

const C13=`#include <Wire.h>

// ===== CONFIG =====
#define EEPROM_ADDR  0x50   // AT24C32 default I2C address
#define EEPROM_SIZE  4096   // 4KB=AT24C32 | 32KB=AT24C256
#define SDA_PIN      21
#define SCL_PIN      22
// ==================

byte readByte(uint16_t addr) {
  Wire.beginTransmission(EEPROM_ADDR);
  Wire.write((addr>>8) & 0xFF);   // MSB of address
  Wire.write(addr & 0xFF);         // LSB of address
  Wire.endTransmission();
  Wire.requestFrom(EEPROM_ADDR, 1);
  return Wire.available() ? Wire.read() : 0xFF;
}

void setup() {
  Serial.begin(115200);
  Wire.begin(SDA_PIN, SCL_PIN);
  Wire.setClock(400000);
  delay(500);
  Serial.printf("[*] EEPROM Dump  0x%02X  —  %d bytes\\n\\n", EEPROM_ADDR, EEPROM_SIZE);
  Serial.println("         00 01 02 03 04 05 06 07  08 09 0A 0B 0C 0D 0E 0F  |  ASCII");
  Serial.println("---------+-------------------------------+------------------+---------");

  for(int base=0; base<EEPROM_SIZE; base+=16) {
    Serial.printf("0x%04X : ", base);
    char asc[17]={0};
    for(int j=0; j<16 && (base+j)<EEPROM_SIZE; j++) {
      byte b = readByte(base+j);
      if(j==8) Serial.print(" ");
      Serial.printf("%02X ", b);
      asc[j] = (b>=0x20 && b<0x7F) ? (char)b : '.';
      delay(2);
    }
    Serial.printf(" |  %s\\n", asc);
  }
  Serial.println("\\n[*] Dump complete.");
}

void loop() {}`;

function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

window.switchTab=function(id){
  activeTab=id; openCards={}; render();
};

window.toggleCard=function(key){
  openCards[key]=!openCards[key]; render();
};

window.copyCode=function(key,i){
  const codes=CODES[activeTab];
  const text=codes[i].code;
  const prev=copiedKey;
  copiedKey=key;
  render();
  setTimeout(()=>{if(copiedKey===key){copiedKey=null;render();}},2000);
  try {
    navigator.clipboard.writeText(text);
  } catch(e) {
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  }
};

render();
